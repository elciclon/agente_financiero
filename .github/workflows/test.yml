name: Correr Pruebas con Pytest

on:
  push:
    branches: [ "main", "master" ] # Ejecutar en push a estas ramas
  pull_request:
    branches: [ "main", "master" ] # También ejecutar en Pull Requests

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"] # Puedes probar en varias versiones a la vez

    steps:
    # 1. Bajar el código del repo
    - uses: actions/checkout@v4

    # 2. Instalar Python
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # 3. Instalar dependencias
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest # Asegura que pytest esté instalado

    # 4. Correr los tests
    - name: Test with pytest
      run: |
        pytest